[project]
name = "resumehub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VanshSharma5", email = "vanshsharmamzn34@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi[standard]>=0.115",
    "mako>=1.4.3",
    "pillow>=12.3.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymongo>=4.13",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
resume-hub = "resumehub:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
